<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martimex Voiceflow Chat</title>
</head>

<body>

  <h1>Martimex Chat Test</h1>
  <p>Voiceflow chat widget je učitan u donjem desnom kutu.</p>

  <!-- Učitava kartice s GitHuba (mora biti PRIJE Voiceflow widget koda) -->
  <script src="https://marinko99.github.io/martimex-chat/martimex-extensions.js?v=2"></script>

  <script type="text/javascript">
    (function(d, t) {
      var v = d.createElement(t);
      var s = d.getElementsByTagName(t)[0];

      v.onload = function() {
        window.voiceflow.chat.load({
          verify: {
            projectID: '6aabec2e323cb129d034dd89'
          },

          url: 'https://general-runtime.voiceflow.com',

          voice: {
            url: "https://runtime-api.voiceflow.com"
          },

          assistant: {
            extensions: window.MartimexExtensions || []
          }
        });
      };

      v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
      v.type = "text/javascript";

      s.parentNode.insertBefore(v, s);
    })(document, 'script');
  </script>

</body>
</html>
